<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='1060' viewBox='0 0 1600 1060' role='img'>
<title>클라이언트 데이터 선택과 누적 방 로딩</title><desc>Join의 입력은 소스를 선택합니다. 검증·타입 주입·Ingame 로더는 두 모드가 공유합니다.</desc><rect width='1600' height='1060' fill='white'/>
